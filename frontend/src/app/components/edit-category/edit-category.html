<div class="container-fluid py-5 bg-light" style="min-height: 100vh;">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <!-- Back Button -->
      <button class="btn btn-link text-decoration-none text-muted mb-3" (click)="goBack()">
        ← Back to Dashboard
      </button>

      <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="d-flex align-items-center mb-4">
          <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
            <span class="fs-4">✏️</span>
          </div>
          <div>
            <h3 class="fw-bold m-0">Edit Category</h3>
            <p class="text-muted small m-0">Modify category details #{{categoryId}}</p>
          </div>
        </div>

        <!-- Loader -->
        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted">Loading category...</p>
        </div>

        <!-- Form -->
        <form *ngIf="!isLoading" [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
          <div class="mb-4">
            <label class="form-label fw-semibold">Category Name</label>
            <input 
              type="text" 
              class="form-control form-control-lg border-2 shadow-none" 
              [class.is-invalid]="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched"
              formControlName="name"
              placeholder="e.g. Electronics">
            
            <div class="invalid-feedback">
              Name is required (min 3 characters).
            </div>
          </div>

          <div class="d-grid gap-2">
            <button 
              type="submit" 
              class="btn btn-primary btn-lg rounded-3 fw-bold" 
              [disabled]="categoryForm.invalid"
              style="background: #5d5be5; border: none;">
              Update Category
            </button>
            <button 
              type="button" 
              class="btn btn-light btn-lg rounded-3 text-muted" 
              (click)="goBack()">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
