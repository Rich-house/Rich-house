<div class="admin-shell">
  <button
    class="admin-shell__mobile-toggle"
    type="button"
    (click)="toggleSidebar()"
    aria-label="Toggle dashboard navigation">
    <i class="bi bi-list"></i>
  </button>

  <button
    *ngIf="sidebarOpen"
    class="admin-shell__overlay"
    type="button"
    (click)="closeSidebar()"
    aria-label="Close dashboard navigation"></button>

  <aside class="admin-shell__sidebar" [class.is-open]="sidebarOpen">
    <div class="admin-shell__brand">
      <img [src]="brand.logoPath" [alt]="brand.logoAlt" width="140" height="60" />
      <div>
        <p>Rich House</p>
        <span>Catalog dashboard</span>
      </div>
    </div>

    <nav class="admin-shell__nav" aria-label="Dashboard navigation">
      <ng-container *ngFor="let item of navItems; trackBy: trackByRoute">
        <a
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard/overview' }"
          [attr.title]="item.superAdminOnly && !canManageUsers ? 'Super admin access required' : null"
          (click)="closeSidebar()">
          <i [class]="'bi ' + item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>

    <button class="admin-shell__logout" type="button" (click)="onLogout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </button>
  </aside>

  <main class="admin-shell__content">
    <router-outlet></router-outlet>
  </main>
</div>
